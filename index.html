<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Stride" />
<meta name="theme-color" content="#e6e9ef" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1e1e2e" media="(prefers-color-scheme: dark)" />
<title>Stride — Training</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="icons/icon-192.svg" />
<link rel="apple-touch-icon" href="icons/icon-192.svg" />
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<header class="top">
  <div class="brandmark">Stride</div>
  <div class="countdown" id="goal-countdown"></div>
</header>

<div class="wrap">

  <!-- RUNNING -->
  <section class="page active" id="page-running"></section>

  <!-- FITNESS -->
  <section class="page" id="page-fitness"></section>

  <!-- GOALS -->
  <section class="page" id="page-goals"></section>

  <!-- SETTINGS -->
  <section class="page" id="page-settings"></section>

</div>

<div id="toast"></div>

<nav class="tabs">
  <button data-page="running" class="active" aria-label="Running">
    <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M3 17c3-1 4-6 7-6s4 3 7-1" /><circle cx="15" cy="5" r="1.6"/></svg></span>
    Running
  </button>
  <button data-page="fitness" aria-label="Fitness">
    <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M3 15c3 0 4-8 7-8s3 5 5 5 3-4 6-4" stroke-linejoin="round"/></svg></span>
    Fitness
  </button>
  <button data-page="goals" aria-label="Goals">
    <span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg></span>
    Goals
  </button>
  <button data-page="settings" aria-label="Settings">
    <span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2 2M16.4 16.4l2 2M5.6 18.4l2-2M16.4 7.6l2-2"/></svg></span>
    Settings
  </button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
