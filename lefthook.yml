pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob:
        - "**/*.{json,js,css,html,md,svg}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

    - name: eslint
      glob:
        - "**/*.js"
      run: npx eslint --fix {staged_files}
      stage_fixed: true

    - name: ruff format
      glob:
        - "**/*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true

    - name: ruff check
      glob:
        - "**/*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true

    - name: ty
      glob: "**/*.py"
      run: uv run ty check {staged_files}

    - name: toml-sort
      glob: "**/*.toml"
      run: uv run toml-sort -i {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: js tests
      glob:
        - "**/*.{js,json,css,html}"
      run: npm test

    - name: lint all js
      glob:
        - "**/*.js"
      run: npx eslint .

    - name: ruff all
      glob:
        - "**/*.py"
      run: uv run ruff check .
