[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "lefthook>=2",
  "pytest>=8.3.4",
  "ruff>=0.15",
  "toml-sort>=0.24",
  "ty>=0.0.34",
  "vulture>=2.14"
]

[project]
name = "stride"
version = "0.1"
description = "A static, Strava-backed running log and marathon training dashboard."
readme = "README.md"
requires-python = ">=3.14, <3.15"
authors = [{name = "Neil Girdhar", email = "mistersheik@gmail.com"}]
maintainers = [{name = "Neil Girdhar", email = "mistersheik@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.2"
]

[project.scripts]
stride-durability-model = "stride.durability_model:main"
stride-race-model = "stride.race_model:main"
stride-sync = "stride.sync_strava:main"

[project.urls]
Changelog = "https://github.com/NeilGirdhar/stride/blob/main/CHANGELOG.md"
Documentation = "https://github.com/NeilGirdhar/stride#readme"
Issues = "https://github.com/NeilGirdhar/stride/issues"
Source = "https://github.com/NeilGirdhar/stride"

[tool.pytest]
addopts = ["--disable-warnings"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "ambiguous-unicode-character-comment",
  "ambiguous-unicode-character-docstring",
  "assert",
  "blanket-type-ignore",
  "commented-out-code",
  "docstring-extraneous-returns",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "float-equality-comparison",
  "line-contains-todo",
  "logging-f-string",
  "magic-value-comparison",
  "missing-copyright-notice",
  "missing-todo-author",
  "missing-todo-link",
  "missing-trailing-comma",
  "no-self-use",
  "pandas-use-of-dot-at",
  "parenthesize-chained-operators",
  "print",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "unused-class-method-argument",
  "unused-function-argument",
  "unused-method-argument",
  "unused-static-method-argument" # Unused static method arg.
]

[tool.ruff.lint.flake8-errmsg]
max-string-length = 40

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"array_api_extra" = "xpx"
"ctypes" = "ct"
"datetime" = "dt"
"equinox" = "eqx"
"itertools" = "it"
"jax.numpy" = "jnp"
"jax.random" = "jr"
"jax.scipy.special" = "jss"
"networkx" = "nx"
"numpy.typing" = "npt"
"optimistix" = "optx"
"optype" = "op"
"optype.numpy" = "onp"
"optype.numpy.compat" = "npc"
"optype.typing" = "opt"
"pyqtgraph" = "pg"
"scipy.special" = "sc"
"seaborn" = "sns"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8
max-locals = 25

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.vulture]
ignore_decorators = ["@cli.command", "@pytest.fixture"]
sort_by_size = true
