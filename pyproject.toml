[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "lefthook>=2",
  "pytest>=8.3.4",
  "ruff>=0.15",
  "toml-sort>=0.24",
  "ty>=0.0.34",
  "vulture>=2.14"
]

[project]
name = "stride"
version = "0.1"
description = "A static, Strava-backed running log and marathon training dashboard."
readme = "README.md"
requires-python = ">=3.14, <3.15"
authors = [{name = "Neil Girdhar", email = "mistersheik@gmail.com"}]
maintainers = [{name = "Neil Girdhar", email = "mistersheik@gmail.com"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.2"
]

[project.scripts]
stride-durability-model = "stride.durability_model:main"
stride-race-model = "stride.race_model:main"
stride-sync = "stride.sync_strava:main"

[project.urls]
Changelog = "https://github.com/NeilGirdhar/stride/blob/main/CHANGELOG.md"
Documentation = "https://github.com/NeilGirdhar/stride#readme"
Issues = "https://github.com/NeilGirdhar/stride/issues"
Source = "https://github.com/NeilGirdhar/stride"

[tool.pytest]
addopts = ["--disable-warnings"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "unused-function-argument", # Unused function arg.
  "unused-method-argument", # Unused method arg.
  "unused-class-method-argument", # Unused class method arg.
  "unused-static-method-argument", # Unused static method arg.
  "missing-trailing-comma", # Missing trailing comma.
  "missing-copyright-notice", # Missing copyright notice.
  "undocumented-public-module", # Missing module docstring.
  "undocumented-public-class", # Missing class docstring.
  "undocumented-public-method", # Missing method docstring.
  "undocumented-public-function", # Missing function docstring.
  "undocumented-magic-method", # Missing magic method docstring.
  "undocumented-public-init", # Missing __init__ docstring.
  "docstring-missing-returns", # Missing return doc.
  "docstring-extraneous-returns", # Extraneous returns section.
  "docstring-missing-yields", # Missing yield doc.
  "docstring-missing-exception", # Missing raised exception doc.
  "commented-out-code", # Commented-out code.
  "line-contains-todo", # TODO comment.
  "logging-f-string", # Logging uses f-string.
  "pandas-use-of-dot-at", # Prefer .loc over .at.
  "blanket-type-ignore", # Use specific type-ignore codes.
  "too-many-arguments", # Too many function arguments.
  "no-self-use", # Method does not use self.
  "ambiguous-unicode-character-docstring", # Ambiguous Unicode character.
  "ambiguous-unicode-character-comment", # Ambiguous minus sign.
  "parenthesize-chained-operators", # Parenthesize mixed and/or.
  "float-equality-comparison", # Float equality comparison.
  "assert", # Assert used.
  "typing-only-first-party-import", # Move app import into TYPE_CHECKING.
  "typing-only-third-party-import", # Move third-party import into TYPE_CHECKING.
  "typing-only-standard-library-import", # Move stdlib import into TYPE_CHECKING.
  "missing-todo-author", # TODO missing author.
  "missing-todo-link", # TODO missing issue link.
  "print", "magic-value-comparison", "too-many-branches", "complex-structure", "suspicious-url-open-usage",
]

[tool.ruff.lint.flake8-errmsg]
max-string-length = 40

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"array_api_extra" = "xpx"
"ctypes" = "ct"
"datetime" = "dt"
"equinox" = "eqx"
"itertools" = "it"
"jax.numpy" = "jnp"
"jax.random" = "jr"
"jax.scipy.special" = "jss"
"networkx" = "nx"
"numpy.typing" = "npt"
"optimistix" = "optx"
"optype" = "op"
"optype.numpy" = "onp"
"optype.numpy.compat" = "npc"
"optype.typing" = "opt"
"pyqtgraph" = "pg"
"scipy.special" = "sc"
"seaborn" = "sns"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8
max-locals = 25

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.vulture]
ignore_decorators = ["@pytest.fixture", "@cli.command"]
sort_by_size = true
